<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả | Hôm nay ăn gì?</title>
  <meta name="description" content="Món ăn đã được chọn cho bạn. Tìm quán gần đây hoặc quay lần nữa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23C2410C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>
  <header class="site-header wrap" data-header></header>

  <main id="main" class="wrap">
    <p class="sr-only" id="result-live" aria-live="polite"></p>

    <article class="result" id="result">
      <div class="result__photo"><img id="dish-photo" alt="" width="1200" height="900"></div>
      <div>
        <p class="result__meta" id="dish-meta">Đang quay...</p>
        <h1 id="dish-name">Hôm nay ăn gì?</h1>
        <p class="result__desc" id="dish-desc">Chờ một chút nhé.</p>
        <div class="result__actions">
          <a class="btn btn--primary btn--lg" id="btn-maps" target="_blank" rel="noopener noreferrer">Tìm quán gần đây</a>
          <button class="btn btn--lg" id="btn-again" type="button">Quay lần nữa</button>
        </div>
        <div class="result__next">
          <section class="delivery-options" aria-labelledby="delivery-title">
            <h2 id="delivery-title">Đặt món qua</h2>
            <div class="delivery-options__links">
              <a class="btn delivery-link delivery-link--grab" href="https://food.grab.com/vn/vi/" target="_blank" rel="noopener noreferrer" aria-label="Mở GrabFood (tab mới)">
                <span class="delivery-link__brand"><img class="brand-grab-light" src="images/brands/grabfood-green.png" alt="GrabFood" width="100" height="24"><img class="brand-grab-dark" src="images/brands/grabfood-white.png" alt="" aria-hidden="true" width="100" height="24"></span>
                <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
              </a>
              <a class="btn delivery-link delivery-link--shopee" href="https://shopeefood.vn/" target="_blank" rel="noopener noreferrer" aria-label="Mở ShopeeFood (tab mới)">
                <span class="delivery-link__brand"><img src="images/brands/shopeefood.png" alt="ShopeeFood" width="90" height="34"></span>
                <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
              </a>
            </div>
            <p class="delivery-options__note">Mở nền tảng để tìm món và chọn địa chỉ giao hàng.</p>
          </section>
          <section class="cook-option" aria-labelledby="cook-title">
            <h2 id="cook-title">Muốn tự tay làm món này?</h2>
            <a class="btn recipe-link" id="btn-recipe" hidden><svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v15M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z"/><path d="M6 8h2M6 12h2M16 8h2M16 12h2"/></svg>Xem công thức nấu <span aria-hidden="true">→</span></a>
          </section>
        </div>
      </div>
    </article>

    <section class="empty" id="empty" hidden>
      <h1 id="empty-title">Chưa có món phù hợp</h1>
      <p id="empty-text">Bạn thử chọn bất kỳ món nào nhé.</p>
      <a class="btn btn--primary btn--lg" href="result.html?mode=any">Chọn bất kỳ món nào</a>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
